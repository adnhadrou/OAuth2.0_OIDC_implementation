{% extends 'base.html' %}
{% block title %}Sign in · AuthFlow Lab{% endblock %}
{% block content %}
  <p class="step">01 / SIGN IN</p>
  <h1>Sign in to the lab</h1>
  <p class="intro">Use the synthetic account created during setup.</p>
  {% if message %}<p class="notice" role="alert">{{ message }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Username
      <input name="username" autocomplete="username" required maxlength="100">
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required maxlength="256">
    </label>
    <div class="actions"><button>Sign in</button></div>
  </form>
{% endblock %}
